<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moss Buddy - Monad AI 助手</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d0d1a;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #13132b;
      border-bottom: 1px solid #2a2a4a;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 {
      font-size: 20px;
      background: linear-gradient(135deg, #7c3aed, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    header .badge {
      font-size: 12px;
      background: #1a1a3e;
      color: #7c3aed;
      padding: 4px 10px;
      border-radius: 12px;
      border: 1px solid #7c3aed33;
    }
    .wallet-links {
      margin-left: auto;
      position: relative;
    }
    .wallet-btn {
      font-size: 12px;
      color: #a0a0c0;
      background: transparent;
      border: 1px solid #2a2a4a;
      border-radius: 8px;
      padding: 4px 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }
    .wallet-btn:hover { border-color: #7c3aed; color: #c0c0e0; }
    .wallet-btn::after {
      content: '\25BC';
      font-size: 8px;
      transition: transform 0.2s;
    }
    .wallet-btn.open::after { transform: rotate(180deg); }
    .wallet-dropdown {
      display: none;
      position: absolute;
      right: 0;
      top: calc(100% + 6px);
      background: #13132b;
      border: 1px solid #2a2a4a;
      border-radius: 10px;
      padding: 6px;
      min-width: 140px;
      z-index: 10;
    }
    .wallet-dropdown.show { display: block; }
    .wallet-dropdown a {
      display: block;
      font-size: 13px;
      color: #a0a0c0;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 6px;
      transition: all 0.15s;
    }
    .wallet-dropdown a:hover { background: #1a1a3e; color: #e0e0e0; }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .msg {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 16px;
      line-height: 1.6;
      font-size: 15px;
      animation: fadeIn 0.3s;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .msg.user {
      align-self: flex-end;
      background: #7c3aed;
      color: white;
      border-bottom-right-radius: 4px;
    }
    .msg.assistant {
      align-self: flex-start;
      background: #1a1a3e;
      border: 1px solid #2a2a4a;
      border-bottom-left-radius: 4px;
    }
    .msg .tool-tag {
      display: inline-block;
      font-size: 11px;
      background: #ffffff15;
      padding: 2px 8px;
      border-radius: 6px;
      margin-bottom: 6px;
    }
    #input-area {
      padding: 16px 24px;
      background: #13132b;
      border-top: 1px solid #2a2a4a;
      display: flex;
      gap: 12px;
    }
    #input-area input {
      flex: 1;
      background: #1a1a3e;
      border: 1px solid #2a2a4a;
      border-radius: 12px;
      padding: 12px 16px;
      color: #e0e0e0;
      font-size: 15px;
      outline: none;
    }
    #input-area input:focus { border-color: #7c3aed; }
    #input-area button {
      background: linear-gradient(135deg, #7c3aed, #3b82f6);
      border: none;
      border-radius: 12px;
      padding: 12px 24px;
      color: white;
      font-size: 15px;
      cursor: pointer;
      font-weight: 600;
    }
    #input-area button:disabled { opacity: 0.5; cursor: not-allowed; }
    .suggestions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      padding: 0 24px 8px;
    }
    .suggestions button {
      background: #1a1a3e;
      border: 1px solid #2a2a4a;
      color: #a0a0c0;
      padding: 6px 14px;
      border-radius: 16px;
      font-size: 13px;
      cursor: pointer;
    }
    .suggestions button:hover { border-color: #7c3aed; color: #c0c0e0; }
    .typing { color: #7c3aed; font-size: 14px; padding: 8px 16px; }
    .faucet-overlay {
      display: none;
      position: fixed;
      top: 0; right: 0;
      width: 420px;
      height: 100vh;
      background: #0d0d1a;
      border-left: 1px solid #2a2a4a;
      z-index: 100;
      flex-direction: column;
    }
    .faucet-overlay.show { display: flex; }
    .faucet-overlay .faucet-header {
      padding: 12px 16px;
      background: #13132b;
      border-bottom: 1px solid #2a2a4a;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .faucet-overlay .faucet-header span { font-size: 14px; color: #a0a0c0; }
    .faucet-overlay .faucet-header button {
      background: none; border: none; color: #666; font-size: 18px; cursor: pointer;
    }
    .faucet-overlay iframe {
      flex: 1;
      border: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>Moss Buddy</h1>
    <span class="badge">Monad Testnet</span>
    <div class="wallet-links">
      <button class="wallet-btn" onclick="toggleWallet()">Wallets</button>
      <div class="wallet-dropdown" id="wallet-dropdown">
        <a href="#" data-wallet="metamask" data-url="https://metamask.io/download/">🦊 MetaMask</a>
        <a href="#" data-wallet="rabby" data-url="https://rabby.io/">🦝 Rabby</a>
        <a href="#" data-wallet="okx" data-url="https://www.okx.com/web3">⭕ OKX Wallet</a>
        <a href="#" data-wallet="trust" data-url="https://trustwallet.com/download">🛡️ Trust Wallet</a>
      </div>
    </div>
  </header>
  <div id="chat">
    <div class="msg assistant">
      嗨！我是 Moss Buddy，你在 Monad 世界的 AI 小伙伴。
      我可以帮你领测试币、查链上状态，还能用大白话解释各种 Web3 概念。
      试试问我点什么吧！
    </div>
  </div>
  <div class="suggestions" id="suggestions"></div>
  <div id="input-area">
    <input id="user-input" type="text" placeholder="输入你的问题..." onkeydown="if(event.key==='Enter') send()">
    <button id="send-btn" onclick="send()">发送</button>
  </div>
  <div class="faucet-overlay" id="faucet-panel">
    <div class="faucet-header">
      <span>Monad Faucet</span>
      <button onclick="closeFaucetPanel()" style="background:none;border:none;color:#666;font-size:18px;cursor:pointer">x</button>
    </div>
    <div id="faucet-hint" style="padding:10px 14px;font-size:13px;color:#a0a0c0;background:#13132b;border-bottom:1px solid #2a2a4a">
      <span id="faucet-addr-text" style="color:#7c3aed">请先连接钱包</span>
      <button id="faucet-copy-btn" onclick="copyAddress()" style="display:none;margin-left:8px;background:#1a1a3e;border:1px solid #2a2a4a;color:#a0a0c0;padding:2px 8px;border-radius:4px;cursor:pointer;font-size:12px">copy</button>
    </div>
    <div style="padding:10px 14px;font-size:12px;color:#888;background:#0d0d1a;border-bottom:1px solid #2a2a4a;line-height:1.8">
      <b style="color:#ccc">操作步骤：</b><br>
      1. 在下方输入框粘贴地址（Enter wallet address）<br>
      2. 勾选「我不是机器人」复选框（Cloudflare 验证）<br>
      3. 按钮变亮后点击领取（Claim / Get Tokens）<br>
      <span style="color:#666">每次可领 5 MON 测试币</span>
    </div>
    <iframe src="https://faucet.monad.xyz/" id="faucet-iframe"></iframe>
  </div>

  <script>
    const chatEl = document.getElementById("chat");
    const inputEl = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");
    const history = [];

    function addMsg(role, text, tools) {
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.appendChild(document.createTextNode(text));
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function showTyping() {
      const el = document.createElement("div");
      el.className = "typing";
      el.id = "typing-indicator";
      el.textContent = "Moss Buddy 正在思考...";
      chatEl.appendChild(el);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function hideTyping() {
      const el = document.getElementById("typing-indicator");
      if (el) el.remove();
    }

    async function send() {
      const text = inputEl.value.trim();
      if (!text) return;
      inputEl.value = "";
      sendBtn.disabled = true;
      addMsg("user", text);
      history.push({ role: "user", content: text });
      showTyping();
      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, history, walletAddress })
        });
        const data = await res.json();
        hideTyping();
        if (data.error) {
          addMsg("assistant", data.error);
        } else {
          addMsg("assistant", data.content, data.usedTools);
          history.push({ role: "assistant", content: data.content });
          if (data.usedTools && data.usedTools.includes("request_faucet")) {
            showFaucetPanel();
          }
        }
      } catch {
        hideTyping();
        addMsg("assistant", "网络好像不太稳定，稍后再试~");
      }
      sendBtn.disabled = false;
      inputEl.focus();
    }

    function sendSuggestion(text) {
      if (walletAddress) {
        text = text.replace("{addr}", walletAddress);
      }
      inputEl.value = text;
      send();
    }

    let walletAddress = null;

    const SUGGESTION_POOL = [
      { label: "领测试币", text: walletAddress ? "领测试币，地址 {addr}" : "领测试币" },
      { label: "查余额", text: "查一下我的余额" },
      { label: "什么是 Gas 费", text: "什么是 Gas 费？" },
      { label: "什么是 NFT", text: "什么是 NFT？" },
      { label: "什么是 DeFi", text: "什么是 DeFi？" },
      { label: "什么是智能合约", text: "什么是智能合约？" },
      { label: "Monad 是什么", text: "Monad 是什么链？" },
    ];
    let suggestionIndex = 0;

    function renderSuggestions() {
      const container = document.getElementById("suggestions");
      const pool = SUGGESTION_POOL.map(s => ({
        label: s.label,
        text: walletAddress ? s.text.replace("{addr}", walletAddress) : s.text
      }));
      const batch = [];
      for (let i = 0; i < 4; i++) {
        batch.push(pool[(suggestionIndex + i) % pool.length]);
      }
      container.innerHTML = batch.map(s =>
        `<button onclick="sendSuggestion('${s.text.replace(/'/g, "\\'")}')">${s.label}</button>`
      ).join("");
    }

    function rotateSuggestions() {
      suggestionIndex = (suggestionIndex + 1) % SUGGESTION_POOL.length;
      renderSuggestions();
    }

    renderSuggestions();
    setInterval(rotateSuggestions, 300000);

    function toggleWallet() {
      const dd = document.getElementById("wallet-dropdown");
      const btn = document.querySelector(".wallet-btn");
      const isOpen = dd.classList.toggle("show");
      btn.classList.toggle("open");
      if (isOpen) detectWallets();
    }

    function detectWallets() {
      const ethereum = window.ethereum;
      const checks = {
        metamask: ethereum?.isMetaMask,
        rabby: ethereum?.isRabby,
        okx: !!window.okxwallet || ethereum?.isOkxWallet,
        trust: ethereum?.isTrust
      };
      document.querySelectorAll("#wallet-dropdown a").forEach(a => {
        const w = a.dataset.wallet;
        if (checks[w]) {
          a.textContent = a.textContent.replace(/\s*\[.*\]$/, "") + (walletAddress ? " [" + walletAddress.slice(0,6) + "..." + walletAddress.slice(-4) + "]" : " [Connect]");
          a.style.color = walletAddress ? "#4ade80" : "#60a5fa";
          a.onclick = async (e) => { e.preventDefault(); await connectWallet(w); };
        } else {
          a.textContent = a.textContent.replace(/\s*\[.*\]$/, "") + " [Install]";
          a.style.color = "#f59e0b";
          a.onclick = (e) => { e.preventDefault(); window.open(a.dataset.url, "_blank"); };
        }
      });
    }

    async function connectWallet(wallet) {
      try {
        const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
        if (accounts.length > 0) {
          walletAddress = accounts[0];
          updateWalletUI();
          document.getElementById("wallet-dropdown").classList.remove("show");
          document.querySelector(".wallet-btn").classList.remove("open");
        }
      } catch (err) {
        if (err.code === 4001) {
          alert("你拒绝了连接请求~");
        } else {
          alert("连接失败: " + err.message);
        }
      }
    }

    function updateWalletUI() {
      const btn = document.querySelector(".wallet-btn");
      btn.innerHTML = walletAddress.slice(0,6) + "..." + walletAddress.slice(-4);
      btn.style.color = "#4ade80";
      btn.style.borderColor = "#4ade8044";
      renderSuggestions();
      updateFaucetHint();
    }

    document.addEventListener("click", function(e) {
      if (!e.target.closest(".wallet-links")) {
        document.getElementById("wallet-dropdown").classList.remove("show");
        document.querySelector(".wallet-btn").classList.remove("open");
      }
    });

    let faucetLang = "cn";

    function showFaucetPanel() {
      document.getElementById("faucet-iframe").src = "https://faucet.monad.xyz/";
      document.getElementById("faucet-panel").classList.add("show");
      updateFaucetHint();
    }

    function closeFaucetPanel() {
      document.getElementById("faucet-panel").classList.remove("show");
    }

    function updateFaucetHint() {
      const txt = document.getElementById("faucet-addr-text");
      const btn = document.getElementById("faucet-copy-btn");
      if (walletAddress) {
        txt.textContent = walletAddress;
        btn.style.display = "inline";
      } else {
        txt.textContent = "请先在顶部 Wallets 连接钱包";
        btn.style.display = "none";
      }
    }

    function copyAddress() {
      if (walletAddress) {
        navigator.clipboard.writeText(walletAddress);
        const btn = document.getElementById("faucet-copy-btn");
        btn.textContent = "copied!";
        setTimeout(() => btn.textContent = "copy", 1500);
      }
    }
  </script>
</body>
</html>
