<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moss Buddy - Monad AI 助手</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d0d1a;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #13132b;
      border-bottom: 1px solid #2a2a4a;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 {
      font-size: 20px;
      background: linear-gradient(135deg, #7c3aed, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    header .badge {
      font-size: 12px;
      background: #1a1a3e;
      color: #7c3aed;
      padding: 4px 10px;
      border-radius: 12px;
      border: 1px solid #7c3aed33;
    }
    .wallet-links {
      margin-left: auto;
      position: relative;
    }
    .wallet-btn {
      font-size: 12px;
      color: #a0a0c0;
      background: transparent;
      border: 1px solid #2a2a4a;
      border-radius: 8px;
      padding: 4px 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }
    .wallet-btn:hover { border-color: #7c3aed; color: #c0c0e0; }
    .wallet-btn::after {
      content: '\25BC';
      font-size: 8px;
      transition: transform 0.2s;
    }
    .wallet-btn.open::after { transform: rotate(180deg); }
    .wallet-dropdown {
      display: none;
      position: absolute;
      right: 0;
      top: calc(100% + 6px);
      background: #13132b;
      border: 1px solid #2a2a4a;
      border-radius: 10px;
      padding: 6px;
      min-width: 140px;
      z-index: 10;
    }
    .wallet-dropdown.show { display: block; }
    .wallet-dropdown a {
      display: block;
      font-size: 13px;
      color: #a0a0c0;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 6px;
      transition: all 0.15s;
    }
    .wallet-dropdown a:hover { background: #1a1a3e; color: #e0e0e0; }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .msg {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 16px;
      line-height: 1.6;
      font-size: 15px;
      animation: fadeIn 0.3s;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .msg.user {
      align-self: flex-end;
      background: #7c3aed;
      color: white;
      border-bottom-right-radius: 4px;
    }
    .msg.assistant {
      align-self: flex-start;
      background: #1a1a3e;
      border: 1px solid #2a2a4a;
      border-bottom-left-radius: 4px;
    }
    .msg .tool-tag {
      display: inline-block;
      font-size: 11px;
      background: #ffffff15;
      padding: 2px 8px;
      border-radius: 6px;
      margin-bottom: 6px;
    }
    #input-area {
      padding: 16px 24px;
      background: #13132b;
      border-top: 1px solid #2a2a4a;
      display: flex;
      gap: 12px;
    }
    #input-area input {
      flex: 1;
      background: #1a1a3e;
      border: 1px solid #2a2a4a;
      border-radius: 12px;
      padding: 12px 16px;
      color: #e0e0e0;
      font-size: 15px;
      outline: none;
    }
    #input-area input:focus { border-color: #7c3aed; }
    #input-area button {
      background: linear-gradient(135deg, #7c3aed, #3b82f6);
      border: none;
      border-radius: 12px;
      padding: 12px 24px;
      color: white;
      font-size: 15px;
      cursor: pointer;
      font-weight: 600;
    }
    #input-area button:disabled { opacity: 0.5; cursor: not-allowed; }
    .suggestions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      padding: 0 24px 8px;
    }
    .suggestions button {
      background: #1a1a3e;
      border: 1px solid #2a2a4a;
      color: #a0a0c0;
      padding: 6px 14px;
      border-radius: 16px;
      font-size: 13px;
      cursor: pointer;
    }
    .suggestions button:hover { border-color: #7c3aed; color: #c0c0e0; }
    .typing { color: #7c3aed; font-size: 14px; padding: 8px 16px; }
  </style>
</head>
<body>
  <header>
    <h1>Moss Buddy</h1>
    <span class="badge">Monad Testnet</span>
    <div class="wallet-links">
      <button class="wallet-btn" onclick="toggleWallet()">Wallets</button>
      <div class="wallet-dropdown" id="wallet-dropdown">
        <a href="#" data-wallet="metamask" data-url="https://metamask.io/download/">MetaMask</a>
        <a href="#" data-wallet="rabby" data-url="https://rabby.io/">Rabby</a>
        <a href="#" data-wallet="okx" data-url="https://www.okx.com/web3">OKX Wallet</a>
        <a href="#" data-wallet="trust" data-url="https://trustwallet.com/download">Trust Wallet</a>
      </div>
    </div>
  </header>
  <div id="chat">
    <div class="msg assistant">
      嗨！我是 Moss Buddy，你在 Monad 世界的 AI 小伙伴。
      我可以帮你领测试币、查链上状态，还能用大白话解释各种 Web3 概念。
      试试问我点什么吧！
    </div>
  </div>
  <div class="suggestions">
    <button onclick="sendSuggestion('帮我领点测试币，地址 0x1234...')">领测试币</button>
    <button onclick="sendSuggestion('什么是 Gas 费？')">什么是 Gas 费</button>
    <button onclick="sendSuggestion('查一下我的余额')">查余额</button>
    <button onclick="sendSuggestion('什么是智能合约？')">什么是智能合约</button>
  </div>
  <div id="input-area">
    <input id="user-input" type="text" placeholder="输入你的问题..." onkeydown="if(event.key==='Enter') send()">
    <button id="send-btn" onclick="send()">发送</button>
  </div>

  <script>
    const chatEl = document.getElementById("chat");
    const inputEl = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");
    const history = [];

    function addMsg(role, text, tools) {
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      if (tools && tools.length) {
        const tag = document.createElement("span");
        tag.className = "tool-tag";
        tag.textContent = `tool: ${tools.join(", ")}`;
        div.appendChild(tag);
      }
      div.appendChild(document.createTextNode(text));
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function showTyping() {
      const el = document.createElement("div");
      el.className = "typing";
      el.id = "typing-indicator";
      el.textContent = "Moss Buddy 正在思考...";
      chatEl.appendChild(el);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function hideTyping() {
      const el = document.getElementById("typing-indicator");
      if (el) el.remove();
    }

    async function send() {
      const text = inputEl.value.trim();
      if (!text) return;
      inputEl.value = "";
      sendBtn.disabled = true;
      addMsg("user", text);
      history.push({ role: "user", content: text });
      showTyping();
      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, history })
        });
        const data = await res.json();
        hideTyping();
        if (data.error) {
          addMsg("assistant", data.error);
        } else {
          addMsg("assistant", data.content, data.usedTools);
          history.push({ role: "assistant", content: data.content });
        }
      } catch {
        hideTyping();
        addMsg("assistant", "网络好像不太稳定，稍后再试~");
      }
      sendBtn.disabled = false;
      inputEl.focus();
    }

    function sendSuggestion(text) {
      inputEl.value = text;
      send();
    }

    function toggleWallet() {
      const dd = document.getElementById("wallet-dropdown");
      const btn = document.querySelector(".wallet-btn");
      const isOpen = dd.classList.toggle("show");
      btn.classList.toggle("open");
      if (isOpen) detectWallets();
    }

    function detectWallets() {
      const ethereum = window.ethereum;
      const checks = {
        metamask: ethereum?.isMetaMask,
        rabby: ethereum?.isRabby,
        okx: !!window.okxwallet || ethereum?.isOkxWallet,
        trust: ethereum?.isTrust
      };
      document.querySelectorAll("#wallet-dropdown a").forEach(a => {
        const w = a.dataset.wallet;
        if (checks[w]) {
          a.textContent = a.textContent.replace(/ .*$/, "") + " [Connected]";
          a.style.color = "#4ade80";
          a.onclick = (e) => { e.preventDefault(); };
        } else {
          a.textContent = a.textContent.replace(/ .*$/, "") + " [Install]";
          a.style.color = "#f59e0b";
          a.onclick = (e) => { e.preventDefault(); window.open(a.dataset.url, "_blank"); };
        }
      });
    }

    document.addEventListener("click", function(e) {
      if (!e.target.closest(".wallet-links")) {
        document.getElementById("wallet-dropdown").classList.remove("show");
        document.querySelector(".wallet-btn").classList.remove("open");
      }
    });
  </script>
</body>
</html>
